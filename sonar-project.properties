# SonarCloud Configuration
sonar.projectKey=IvanAusechaS_finance-manager-frontend
sonar.organization=ivanausechas

# Project metadata
sonar.projectName=Finance Manager Frontend
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=src/lib,src/pages
sonar.tests=src/lib
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions - Don't analyze these files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/*.config.js,**/components/**,src/main.tsx,src/index.css,src/styles/**,src/App.tsx,**/*.d.ts

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions - Don't require coverage for these
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/*.config.ts,src/pages/*.tsx

# Duplication exclusions
sonar.cpd.exclusions=**/components/**,**/*.test.ts,**/*.test.tsx,src/pages/*.tsx

# Language
sonar.sourceEncoding=UTF-8

# Quality Gate - Focus on new code
sonar.qualitygate.wait=true
sonar.newCode.referenceBranch=develop

# Security - Ignore certain warnings
sonar.issue.ignore.multicriteria=e1,e2

# Ignore localStorage usage in TODO comments (S2255)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2255
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx

# Ignore hardcoded credentials in commented code (S6418)
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6418
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.tsx
