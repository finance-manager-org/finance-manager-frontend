name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Lint and Format Check
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check code formatting
        run: npm run format:check
        continue-on-error: true

  # Job 2: Type Check
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # Job 3: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 4: Build Verification
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory exists"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Job 5: Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Job 6: Acceptance Criteria Validation
  validation:
    name: Validate Acceptance Criteria
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate HU10 - Signup (US-1)
        run: |
          echo "✓ Checking Signup component structure..."
          test -f "src/pages/Signup.tsx" || exit 1
          echo "✓ Checking validation utilities..."
          test -f "src/lib/validations.ts" || exit 1
          echo "✓ HU10 structure validation passed"
      
      - name: Validate HU11 - Login (US-2)
        run: |
          echo "✓ Checking Login component..."
          test -f "src/pages/Login.tsx" || exit 1
          echo "✓ Checking Dashboard component..."
          test -f "src/pages/Dashboard.tsx" || exit 1
          echo "✓ HU11 structure validation passed"
      
      - name: Validate HU12 - Password Recovery (US-3)
        run: |
          echo "✓ Checking ForgotPassword component..."
          test -f "src/pages/ForgotPassword.tsx" || exit 1
          echo "✓ Checking ResetPassword component..."
          test -f "src/pages/ResetPassword.tsx" || exit 1
          echo "✓ HU12 structure validation passed"
      
      - name: All validations passed
        run: echo "🎉 All acceptance criteria validations passed!"

  # Summary Job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, security, validation]
    if: success()
    
    steps:
      - name: CI passed
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "📦 Build artifacts are ready"
          echo "🔒 Security audit completed"
          echo "✓ Code quality verified"
