# SonarCloud Configuration
sonar.projectKey=IvanAusechaS_finance-manager-frontend
sonar.organization=ivanausechas

# Project metadata
sonar.projectName=Finance Manager Frontend
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/*.config.js

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/*.config.ts,**/*.config.js,src/main.tsx

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8
